name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            cmake-args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-latest
            cmake-args: ""
          - os: ubuntu-latest
            cmake-args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release

      # Validate the built VST3 with pluginval at the project's mandated strictness.
      # (Unit tests are not run here: Tests/ lives in Diversion, not the git mirror.)
      - name: Validate with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate "build/TransientCreator_artefacts/Release/VST3/Transient Creator.vst3"

      - name: Validate with pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate "build/TransientCreator_artefacts/Release/VST3/Transient Creator.vst3"

      - name: Validate with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -L "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -o pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval_dir
          & "pluginval_dir/pluginval.exe" --strictness-level 10 --validate "build/TransientCreator_artefacts/Release/VST3/Transient Creator.vst3"

      - name: Verify universal binary and macOS 11.0 floor (macOS)
        if: runner.os == 'macOS'
        run: |
          for BIN in "build/TransientCreator_artefacts/Release/VST3/Transient Creator.vst3/Contents/MacOS/Transient Creator" \
                     "build/TransientCreator_artefacts/Release/AU/Transient Creator.component/Contents/MacOS/Transient Creator"; do
            echo "$BIN: $(lipo -archs "$BIN") minos $(otool -l "$BIN" | awk '/minos/{print $2}' | sort -u | tr '\n' ' ')"
            lipo -archs "$BIN" | grep -q arm64 && lipo -archs "$BIN" | grep -q x86_64
            test "$(otool -l "$BIN" | awk '/minos/{print $2}' | sort -u)" = "11.0"
          done

      - name: Upload VST3, AU and Standalone (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TransientCreator-macOS
          path: |
            build/TransientCreator_artefacts/Release/VST3/*.vst3
            build/TransientCreator_artefacts/Release/AU/*.component
            build/TransientCreator_artefacts/Release/Standalone/*.app

      - name: Upload VST3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TransientCreator-Windows-VST3
          path: build/TransientCreator_artefacts/Release/VST3/*.vst3

      - name: Upload VST3 (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TransientCreator-Linux-VST3
          path: build/TransientCreator_artefacts/Release/VST3/*.vst3
